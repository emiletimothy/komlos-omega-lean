<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komlós Formalization Progress</title>
<style>
  :root {
    --done: #16a34a;      --done-bg: #dcfce7;
    --cond: #d97706;      --cond-bg: #dcfce7;
    --partial: #ea580c;   --partial-bg: #ffedd5;
    --missing: #dc2626;   --missing-bg: #fee2e2;
    --external: #15803d;  --external-bg: #f0fdf4;
    --ink: #1f2937; --muted: #6b7280; --line: #d1d5db;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, -apple-system, "SF Mono", Menlo, monospace;
         color: var(--ink); background: #f8fafc; height: 100vh; overflow: hidden; }
  header { padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  .stats { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; }
  .pill { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .p-done { background: var(--done-bg); color: var(--done); }
  .p-cond { background: #fef3c7; color: var(--cond); }
  .p-partial { background: var(--partial-bg); color: var(--partial); }
  .p-missing { background: var(--missing-bg); color: var(--missing); }
  .p-external { background: var(--external-bg); color: var(--external);
                border: 1px dashed var(--external); }
  #bar { width: 180px; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
  #bar > div { height: 100%; background: var(--done); transition: width .4s; }
  #meta { font-size: 11px; color: var(--muted); }
  #wrap { display: flex; height: calc(100vh - 49px); }
  #canvas { flex: 1; position: relative; overflow: hidden; cursor: grab; }
  #canvas:active { cursor: grabbing; }
  svg { display: block; width: 100%; height: 100%; }
  .node rect { stroke-width: 2; rx: 10; }
  .node { cursor: pointer; }
  .node text { pointer-events: none; }
  .node.sel rect { stroke-width: 3.5; }
  .edge { fill: none; stroke: #94a3b8; stroke-width: 1.6; }
  .edge.ext { stroke-dasharray: 5 4; stroke: #86efac; }
  .badge { font-size: 9px; font-weight: 700; }
  #panel { width: 340px; background: #fff; border-left: 1px solid var(--line);
           padding: 16px; overflow-y: auto; font-size: 13px; }
  #panel h2 { font-size: 15px; margin: 0 0 4px; }
  #panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  #panel .statuschip { display: inline-block; padding: 2px 10px; border-radius: 999px;
                       font-size: 11px; font-weight: 700; margin-bottom: 10px; }
  #panel ul { padding-left: 16px; margin: 8px 0; }
  #panel li { margin: 3px 0; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  #panel li.miss { color: var(--missing); }
  #panel .file { color: var(--muted); }
  #controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
  #controls button { width: 30px; height: 30px; border: 1px solid var(--line);
      background: #fff; border-radius: 6px; font-size: 15px; cursor: pointer; }
  #controls button:hover { background: #f1f5f9; }
  #legend { position: absolute; bottom: 10px; left: 10px; background: #ffffffee;
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
      font-size: 11px; line-height: 1.9; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px;
        margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <h1>Komlós → Lean&nbsp;4 formalization progress</h1>
  <div id="bar"><div style="width:0%"></div></div>
  <div class="stats" id="stats"></div>
  <div id="meta"></div>
</header>
<div id="wrap">
  <div id="canvas">
    <svg id="svg">
      <defs>
        <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)"
                 patternUnits="userSpaceOnUse">
          <rect width="7" height="7" fill="#f0fdf4"/>
          <line x1="0" y1="0" x2="0" y2="7" stroke="#bbf7d0" stroke-width="3"/>
        </pattern>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
        </marker>
        <marker id="arrext" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
        </marker>
      </defs>
      <g id="viewport"></g>
    </svg>
    <div id="controls">
      <button id="zin" title="zoom in">+</button>
      <button id="zout" title="zoom out">−</button>
      <button id="fit" title="fit">⤢</button>
    </div>
    <div id="legend">
      <div><span class="sw" style="background:var(--done-bg);border:2px solid var(--done)"></span>certified in Lean (audited)</div>
      <div><span class="sw" style="background:var(--cond-bg);border:2px dashed var(--cond)"></span>certified, conditional hypotheses</div>
      <div><span class="sw" style="background:var(--partial-bg);border:2px solid var(--partial)"></span>exists, outside audited build</div>
      <div><span class="sw" style="background:var(--missing-bg);border:2px solid var(--missing)"></span>not formalized yet</div>
      <div><span class="sw" style="background:repeating-linear-gradient(45deg,#f0fdf4,#f0fdf4 3px,#bbf7d0 3px,#bbf7d0 6px);border:2px dashed var(--external)"></span>external / axioms (as-is)</div>
    </div>
  </div>
  <div id="panel"><em>Click a node for details.</em></div>
</div>
<script src="graph_data.js"></script>
<script>
const NODE_W = 185, NODE_H = 56, TIER_GAP = 118, COL_GAP = 24;
const STATUS_STYLE = {
  done:       { fill: "var(--done-bg)",     stroke: "var(--done)",    dash: "" },
  conditional:{ fill: "var(--cond-bg)",     stroke: "var(--cond)",    dash: "6 4" },
  partial:    { fill: "var(--partial-bg)",  stroke: "var(--partial)", dash: "" },
  missing:    { fill: "var(--missing-bg)",  stroke: "var(--missing)", dash: "" },
  external:   { fill: "url(#hatch)",        stroke: "var(--external)",dash: "5 4" },
};
const STATUS_LABEL = {
  done: "certified", conditional: "certified — conditional",
  partial: "unaudited / partial", missing: "not done", external: "external"
};

let graph = null, view = { x: 40, y: 30, k: 0.62 }, selected = null;
const svg = document.getElementById("svg"), vp = document.getElementById("viewport");
const canvas = document.getElementById("canvas");

function layout(g) {
  const tiers = {};
  g.nodes.forEach(n => (tiers[n.tier] ??= []).push(n));
  const pos = {};
  Object.values(tiers).forEach(list => {
    list.sort((a, b) => a.order - b.order);
    const w = list.length * (NODE_W + COL_GAP) - COL_GAP;
    list.forEach((n, i) => {
      pos[n.id] = { x: -w / 2 + i * (NODE_W + COL_GAP) + NODE_W / 2,
                    y: n.tier * TIER_GAP + NODE_H / 2 };
    });
  });
  return pos;
}

function render() {
  if (!graph) return;
  const pos = layout(graph), byId = {};
  graph.nodes.forEach(n => byId[n.id] = n);
  vp.innerHTML = "";

  // edges first (under nodes)
  for (const [a, b] of graph.edges) {
    const na = byId[a], nb = byId[b], pa = pos[a], pb = pos[b];
    const ext = na.kind === "external";
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const x1 = pa.x, y1 = pa.y - NODE_H / 2, x2 = pb.x, y2 = pb.y + NODE_H / 2;
    const my = (y1 + y2) / 2;
    p.setAttribute("d", `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    p.setAttribute("class", "edge" + (ext ? " ext" : ""));
    p.setAttribute("marker-end", `url(#${ext ? "arrext" : "arr"})`);
    vp.appendChild(p);
  }

  for (const n of graph.nodes) {
    const { x, y } = pos[n.id], st = STATUS_STYLE[n.status];
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "node" + (selected === n.id ? " sel" : ""));
    g.setAttribute("transform", `translate(${x - NODE_W / 2},${y - NODE_H / 2})`);
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("width", NODE_W); r.setAttribute("height", NODE_H);
    r.setAttribute("fill", st.fill); r.setAttribute("stroke", st.stroke);
    if (st.dash) r.setAttribute("stroke-dasharray", st.dash);
    g.appendChild(r);
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", NODE_W / 2); t.setAttribute("y", 23);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("style", "font-size:12.5px;font-weight:650;fill:var(--ink)");
    t.textContent = n.label.length > 24 ? n.label.slice(0, 23) + "…" : n.label;
    g.appendChild(t);
    const s = document.createElementNS("http://www.w3.org/2000/svg", "text");
    s.setAttribute("x", NODE_W / 2); s.setAttribute("y", 40);
    s.setAttribute("text-anchor", "middle");
    s.setAttribute("style", "font-size:10px;fill:var(--muted)");
    s.textContent = n.sub.length > 30 ? n.sub.slice(0, 29) + "…" : n.sub;
    g.appendChild(s);
    if (n.status === "conditional") {
      const b = document.createElementNS("http://www.w3.org/2000/svg", "text");
      b.setAttribute("x", NODE_W - 6); b.setAttribute("y", 12);
      b.setAttribute("text-anchor", "end");
      b.setAttribute("class", "badge"); b.setAttribute("fill", "var(--cond)");
      b.textContent = "hyp.";
      g.appendChild(b);
    }
    g.addEventListener("click", e => { e.stopPropagation(); select(n.id); });
    vp.appendChild(g);
  }
  applyView();
}

function applyView() {
  vp.setAttribute("transform",
    `translate(${view.x},${view.y}) scale(${view.k})`);
}

function fit() {
  if (!graph) return;
  const pos = layout(graph);
  const xs = Object.values(pos).map(p => p.x), ys = Object.values(pos).map(p => p.y);
  const x0 = Math.min(...xs) - NODE_W / 2 - 40, x1 = Math.max(...xs) + NODE_W / 2 + 40;
  const y0 = Math.min(...ys) - NODE_H / 2 - 40, y1 = Math.max(...ys) + NODE_H / 2 + 40;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  view.k = Math.min(cw / (x1 - x0), ch / (y1 - y0), 1);
  view.x = (cw - (x1 - x0) * view.k) / 2 - x0 * view.k;
  view.y = (ch - (y1 - y0) * view.k) / 2 - y0 * view.k;
  applyView();
}

// pan / zoom
let drag = null;
canvas.addEventListener("mousedown", e => {
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  view.x = drag.vx + e.clientX - drag.x;
  view.y = drag.vy + e.clientY - drag.y;
  applyView();
});
window.addEventListener("mouseup", () => drag = null);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const k2 = Math.min(3, Math.max(0.1, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  view.x = mx - (mx - view.x) * (k2 / view.k);
  view.y = my - (my - view.y) * (k2 / view.k);
  view.k = k2; applyView();
}, { passive: false });
document.getElementById("zin").onclick = () => { view.k *= 1.25; applyView(); };
document.getElementById("zout").onclick = () => { view.k /= 1.25; applyView(); };
document.getElementById("fit").onclick = fit;
canvas.addEventListener("click", () => select(null));

function select(id) {
  selected = id;
  render();
  const panel = document.getElementById("panel");
  if (!id) { panel.innerHTML = "<em>Click a node for details.</em>"; return; }
  const n = graph.nodes.find(x => x.id === id);
  const st = STATUS_STYLE[n.status];
  let html = `<h2>${n.label}</h2><div class="sub">${n.sub}</div>
    <span class="statuschip" style="background:${st.fill === "url(#hatch)" ? "#f0fdf4" : st.fill};
      color:${st.stroke};border:1px solid ${st.stroke}">${STATUS_LABEL[n.status]}</span>`;
  if (n.notes) html += `<p>${n.notes}</p>`;
  if (n.kind === "milestone") html += `<p class="file">Status is rolled up from its supporting components (worst case wins).</p>`;
  if (n.broken) html += `<p style="color:var(--missing);font-weight:600">Build failed — declarations below are in a file that does not currently compile.</p>`;
  if (n.unaudited) html += `<p style="color:var(--partial)">Outside audited build / flagged: ${n.unaudited.join(", ")}</p>`;
  if (n.resolved && n.resolved.length) {
    const found = n.resolved.filter(r => r.file), miss = n.resolved.filter(r => !r.file);
    html += `<b>${found.length}/${n.resolved.length} declarations found</b><ul>`;
    for (const r of found)
      html += `<li><b>${r.name}</b> <span class="file">${r.file}:${r.line}</span></li>`;
    for (const r of miss)
      html += `<li class="miss">${r.name} — not found</li>`;
    html += "</ul>";
  }
  panel.innerHTML = html;
}

function updateHeader() {
  const c = graph.stats.counts;
  const total = c.done + c.conditional + c.partial + c.missing;
  const pct = total ? Math.round(100 * (c.done + c.conditional) / total) : 0;
  document.querySelector("#bar > div").style.width = pct + "%";
  document.getElementById("stats").innerHTML =
    `<span class="pill p-done">${c.done} certified</span>` +
    `<span class="pill p-cond">${c.conditional} conditional</span>` +
    `<span class="pill p-partial">${c.partial} unaudited</span>` +
    `<span class="pill p-missing">${c.missing} missing</span>` +
    `<span class="pill p-external">${c.external} external</span>` +
    `<span>${pct}% · ${graph.stats.declarations} Lean declarations tracked</span>`;
  const a = graph.stats.lastAudit;
  document.getElementById("meta").textContent =
    (a ? `last audit: ${a.declarations} decls clean (${a.ranAt}) · ` : "") +
    (a && a.failedFiles ? `⚠ build failures: ${a.failedFiles.join(", ")} · ` : "") +
    `graph generated ${graph.generated}`;
}

function useGraph(g) {
  if (graph && g.generated === graph.generated) return;
  graph = g; render(); updateHeader();
  if (selected) select(selected);
}

async function refresh() {
  try {
    const r = await fetch("graph_data.json?ts=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw 0;
    useGraph(await r.json());
  } catch (e) {
    // file:// or server down: use data embedded by generate_graph.py
    if (typeof EMBEDDED_GRAPH !== "undefined" && !graph) useGraph(EMBEDDED_GRAPH);
  }
}

refresh().then(fit);
setInterval(refresh, 15000);
</script>
</body>
</html>
